name: Database Backup

# Weekly dump + manual run. Never on pull requests.
on:
  schedule:
    # Mondays 03:15 UTC
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump and upload artifact
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "DATABASE_URL secret is present (value not printed)."

      - name: Install PostgreSQL 17 client (PGDG)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump database (public schema)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Do not echo DATABASE_URL or any connection details.
          trap 'echo "::error::pg_dump failed. Check: client/server version mismatch, authentication (user/password/role), or network reachability to the database host. Connection string is not printed."' ERR

          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PG_DUMP" --version

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="ember-oak-backup-${STAMP}.sql"

          # public schema + data only. Skip Supabase-managed schemas the pooler user cannot read.
          # Explicit path so PATH cannot pick up an older system pg_dump (e.g. 16.x).
          "$PG_DUMP" \
            --format=plain \
            --no-owner \
            --no-privileges \
            --schema=public \
            --file="$OUT" \
            "$DATABASE_URL"

          if [ ! -s "$OUT" ]; then
            echo "::error::Dump file is empty. Aborting upload."
            exit 1
          fi

          gzip -9 "$OUT"
          if [ ! -s "${OUT}.gz" ]; then
            echo "::error::Compressed dump is empty. Aborting upload."
            exit 1
          fi

          ls -lh "${OUT}.gz"
          echo "BACKUP_FILE=${OUT}.gz" >> "$GITHUB_ENV"

      - name: Upload private artifact (30 days)
        uses: actions/upload-artifact@v7
        with:
          name: database-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
